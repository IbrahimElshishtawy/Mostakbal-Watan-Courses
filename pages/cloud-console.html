<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="green">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090e1a">
  <title>الكونسول السحابي التفاعلي | حزب مستقبل وطن</title>
  <link rel="icon" type="image/jpeg" href="../assets/images/logo_union.jpeg">

  <!-- Google Fonts: Cairo & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Modular Design System Styles -->
  <link rel="stylesheet" href="../src/styles/variables.css">
  <link rel="stylesheet" href="../src/styles/reset.css">
  <link rel="stylesheet" href="../src/styles/globals.css">
  <link rel="stylesheet" href="../src/styles/components.css">
  <link rel="stylesheet" href="../src/styles/layouts.css">
  <link rel="stylesheet" href="../src/styles/utilities.css">
  <link rel="stylesheet" href="../src/styles/python-adventure.css">

  <style>
    body {
      background-color: #060913;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .cloud-console-standalone-nav {
      background: rgba(13, 21, 38, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .nav-brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .nav-brand-text h1 {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .nav-brand-text p {
      font-size: 0.72rem;
      color: #94a3b8;
      margin: 0;
    }

    .nav-actions-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-nav-return {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(51, 65, 85, 0.8);
      color: #f1f5f9;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.2s ease;
    }

    .btn-nav-return:hover {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .cloud-console-page-content {
      flex: 1;
      padding: 1.5rem;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      .cloud-console-page-content {
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Standalone Navigation Bar -->
  <header class="cloud-console-standalone-nav">
    <div class="nav-brand-group">
      <img src="../assets/images/logo_union.jpeg" alt="شعار حزب مستقبل وطن" class="nav-brand-logo">
      <div class="nav-brand-text">
        <h1>
          <span>منصة مستقبل وطن</span>
          <span style="font-size:0.75rem; background:rgba(14,165,233,0.18); color:#38bdf8; padding:0.1rem 0.5rem; border-radius:6px; border:1px solid rgba(56,189,248,0.3);">الكونسول السحابي</span>
        </h1>
        <p>بيئة تشغيل تفاعلية متصلة بمحرك Python 3.10 WebAssembly</p>
      </div>
    </div>

    <div class="nav-actions-group">
      <a href="student.html" class="btn-nav-return" title="العودة إلى لوحة تحكم الطالب الرئيسية">
        <span>← العودة لبوابة الطالب</span>
      </a>
    </div>
  </header>

  <!-- Main Console Workspace Host Container -->
  <main class="cloud-console-page-content">
    <div id="standaloneConsoleHost"></div>
  </main>

  <!-- Modular Scripts -->
  <script type="module">
    import { CloudConsoleController } from "../src/features/cloud-console/cloud-console.controller.js";
    import { AuthController } from "../src/features/auth/auth.controller.js";

    document.addEventListener("DOMContentLoaded", async () => {
      // Validate active session
      let student = null;
      try {
        const session = AuthController.getCurrentSession();
        if (session && session.user) {
          student = session.user;
        }
      } catch (e) {
        console.warn("Session check fallback:", e);
      }

      // Initialize Console
      await CloudConsoleController.init("standaloneConsoleHost", student);
    });
  </script>
</body>
</html>
