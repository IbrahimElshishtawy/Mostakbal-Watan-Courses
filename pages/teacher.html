<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="gold">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121519">
  <title>لوحة تحكم المعلم | اتحاد بشبابها</title>
  <link rel="icon" type="image/jpeg" href="../assets/images/logo_union.jpeg">

  <!-- Google Fonts: Cairo, Fira Code, Plus Jakarta Sans & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Font Awesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind CSS v3 with Plugins & Exact Theme Config -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#8ed5ff',
            'primary-container': '#38bdf8',
            'on-primary': '#00354a',
            'on-primary-container': '#004965',
            secondary: '#c0c1ff',
            'secondary-container': '#3131c0',
            'on-secondary': '#1000a9',
            tertiary: '#ffbcbf',
            'tertiary-container': '#ff929a',
            'on-tertiary': '#67001b',
            'surface-container-lowest': '#090e1c',
            'surface-container-low': '#161b2a',
            'surface-container': '#1a1f2e',
            'surface-container-high': '#252a39',
            'surface-container-highest': '#303444',
            'on-surface': '#dee2f6',
            'on-surface-variant': '#bdc8d1',
            'outline-variant': '#3e484f',
            'primary-fixed-dim': '#7bd0ff',
            'primary-fixed': '#c4e7ff',
            'tertiary-fixed-dim': '#ffb2b7',
            'secondary-fixed-dim': '#c0c1ff',
            'error-container': '#93000a',
            'on-error-container': '#ffdad6',
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
              dark: '#0c1017',
              navy: '#111723',
              card: '#161e2e',
              border: '#222f46',
              emerald: '#10b981',
              cyan: '#06b6d4',
              gold: '#f59e0b',
            },
            surface: {
              lowest: '#070b14',
              base: '#0b1120',
              card: '#111827',
              lighter: '#1a2337',
              border: '#1e293b',
              hover: '#243049'
            },
            accent: {
              cyan: '#38bdf8',
              emerald: '#10b981',
              rose: '#f43f5e',
              amber: '#f59e0b',
              indigo: '#6366f1'
            }
          },
          fontFamily: {
            sans: ['Cairo', 'Plus Jakarta Sans', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
            headline: ['Space Grotesk', 'Cairo', 'sans-serif'],
          },
          boxShadow: {
            'glow-cyan': '0 0 20px -3px rgba(56, 189, 248, 0.25)',
            'glow-emerald': '0 0 20px -3px rgba(16, 185, 129, 0.25)',
          }
        }
      }
    };
  </script>

  <!-- Modular Design System Styles -->
  <link rel="stylesheet" href="../src/styles/variables.css">
  <link rel="stylesheet" href="../src/styles/reset.css">
  <link rel="stylesheet" href="../src/styles/globals.css">
  <link rel="stylesheet" href="../src/styles/components.css">
  <link rel="stylesheet" href="../src/styles/layouts.css">
  <link rel="stylesheet" href="../src/styles/utilities.css">
  <link rel="stylesheet" href="../src/styles/attendance.css">
  <link rel="stylesheet" href="../src/styles/profile.css">
  <link rel="stylesheet" href="../src/styles/python-adventure.css">
  <link rel="stylesheet" href="../src/styles/admin-dashboard.css">
  <link rel="stylesheet" href="../src/styles/print.css">
</head>
<body>

  <!-- Root Mount Node -->
  <div id="appRoot">
    <div class="portal-initial-loader">
      <div class="portal-loader-card">
        <div class="portal-loader-emblem-wrap">
          <div class="portal-loader-ring" aria-hidden="true"></div>
          <img src="../assets/images/logo_union.jpeg" alt="شعار المنصة" class="portal-loader-logo">
        </div>
        <h3 class="portal-loader-title">اتحاد بشبابها - بوابة المعلم</h3>
        <div class="portal-loader-status">
          <span class="splash-pulse-dot" aria-hidden="true"></span>
          <span>جاري التحقق من صلاحيات المعلم وتجهيز لوحتك... ⏳</span>
        </div>
        <div class="portal-loader-progress" aria-hidden="true">
          <div class="portal-loader-progress-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container"></div>

  <!-- Application Bootstrap & Controller Wiring -->
  <script type="module">
    import { Router } from "../src/app/router.js?v=3.5.3";
    import { ROLES } from "../src/core/constants.js?v=3.5.3";
    import { mountTeacherLayout } from "../src/shared/layouts/TeacherLayout/teacher-layout.component.js?v=3.5.3";
    import { renderVideoPlayerModal } from "../src/features/lectures/components/video-player-modal.component.js?v=3.5.3";
    import { LecturesController } from "../src/features/lectures/lectures.controller.js?v=3.5.3";
    import { NotificationsController } from "../src/features/notifications/notifications.controller.js?v=3.5.3";
    import { AuthController } from "../src/features/auth/auth.controller.js?v=3.5.3";
    import { bootstrapApp } from "../src/app/bootstrap.js?v=3.5.3";

    bootstrapApp();

    const root = document.getElementById("appRoot");

    function renderPortalFallback(message = "تعذر التحقق من صلاحيات المعلم.") {
      if (!root) return;
      root.innerHTML = `
        <div class="portal-initial-loader">
          <div class="portal-loader-card" style="border-color: rgba(239, 68, 68, 0.4);">
            <div class="portal-loader-emblem-wrap">
              <span style="font-size: 3rem; line-height: 1;">🔐</span>
            </div>
            <h3 class="portal-loader-title">اتحاد بشبابها - بوابة المعلم</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem;">
              ${message}
            </p>
            <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
              <a href="../index.html" class="btn btn-primary" style="padding: 0.6rem 1.25rem;">
                <span>الانتقال لتسجيل الدخول 🚀</span>
              </a>
              <button id="portalRetryBtn" class="btn btn-secondary" style="padding: 0.6rem 1.25rem;">
                <span>إعادة المحاولة 🔄</span>
              </button>
            </div>
          </div>
        </div>
      `;
      document.getElementById("portalRetryBtn")?.addEventListener("click", () => {
        window.location.reload();
      });
    }

    // Safety Watchdog: Never allow infinite loading card to stay stuck on screen
    const watchdogTimer = setTimeout(() => {
      const activeLoader = document.querySelector("#appRoot .portal-initial-loader");
      if (activeLoader) {
        console.warn("[Watchdog] Initial loader still present after 4s. Showing fallback action.");
        renderPortalFallback("استغرق التحقق وقتاً طويلاً. يرجى تسجيل الدخول مرة أخرى.");
      }
    }, 4000);

    try {
      // 1. Guard Teacher / Admin Route
      const { user, role } = await Router.guard([ROLES.TEACHER, ROLES.ADMIN]);

      clearTimeout(watchdogTimer);

      // Lazy feature loaders with promise caching
      const ts = Date.now();
      const lazyLoaders = {
        exams: () => import(`../src/features/exams/exam.controller.js?v=3.5.3&t=${ts}`).then((m) => m.ExamController),
        assignments: () => import(`../src/features/assignments/assignment.controller.js?v=3.5.3&t=${ts}`).then((m) => m.AssignmentController),
        students: () => import(`../src/features/students/students.controller.js?v=3.5.3&t=${ts}`).then((m) => m.StudentsController),
        attendance: () => import(`../src/features/attendance/attendance.controller.js?v=3.5.3&t=${ts}`).then((m) => m.AttendanceController),
        pythonAdventure: () => import(`../src/features/python-adventure/python-adventure.controller.js?v=3.5.3&t=${ts}`).then((m) => m.PythonAdventureController),
        profile: () => import(`../src/features/profile/profile.controller.js?v=3.5.3&t=${ts}`).then((m) => m.ProfileController)
      };

      // 2. Mount Teacher Layout Immediately
      const layout = mountTeacherLayout(root, {
        onLogout: () => AuthController.logout(),
        onTabChange: (tabId) => {
          if (tabId === "data") {
            LecturesController.loadTeacherLectures("teacherDataContainer");
          } else if (tabId === "exams") {
            lazyLoaders.exams().then((c) => c.loadTeacherExams("teacherExamsContainer"));
          } else if (tabId === "assignments") {
            lazyLoaders.assignments().then((c) => c.loadTeacherAssignments("teacherAssignmentsContainer"));
          } else if (tabId === "students") {
            lazyLoaders.students().then((c) => c.loadStudentsList("teacherStudentsContainer", { canDelete: false }));
          } else if (tabId === "attendance") {
            lazyLoaders.attendance().then((c) => c.loadTeacherAttendance("teacherAttendanceContainer"));
          } else if (tabId === "python-adventure") {
            lazyLoaders.pythonAdventure().then((c) => c.init("teacherPythonAdventureContainer", { role: "teacher", uid: "teacher_admin" }));
          } else if (tabId === "settings") {
            lazyLoaders.profile().then((c) => c.loadSettingsView("teacherSettingsContainer"));
          }
        }
      });

      layout.updateProfile({
        name: "المعلم",
        email: user.email || "teacher@system.local"
      });

      // 3. Mount Video Preview Modal into DOM
      if (!document.getElementById("videoPlayerModal")) {
        document.body.insertAdjacentHTML("beforeend", renderVideoPlayerModal());
      }

      // 4. Initial Tab Activation (Instant response)
      LecturesController.loadTeacherLectures("teacherDataContainer");

      // 5. In Background: Mount Notifications Bell (Non-blocking)
      NotificationsController.init({
        bellMountPoint: "teacherNotificationBellSlot",
        onNavigate: (section) => {
          if (section) layout.switchTab(section);
        }
      }).catch((err) => console.warn("Notifications non-blocking init warning:", err));

    } catch (err) {
      clearTimeout(watchdogTimer);
      console.error("Teacher page initialization error:", err);
      renderPortalFallback("يرجى تسجيل الدخول بحساب المعلم أو الإدارة.");
      setTimeout(() => {
        window.location.replace("../index.html");
      }, 1200);
    }
  </script>
</body>
</html>
